  // ①(P-144 `children` 子系) 子系（子发射器）的 def / 材质 / 贴图解析 —— **与父层同一条回退链**：
  //   ① 包内 entry ② `/weassist/<path>`（= WE 资产目录）③ 预设 basename 索引（`PARTICLE_PRESET_INDEX`）；
  //   材质多一档"与 def 同主题的 `presets/<主题>/materials/**`"（Q5 的口径）。
  //   结果挂 `layer.__pchildMap`（`Map<def 路径, {def, texName, blending, defRel, src}>`）——
  //   33 条同名 Matrix 子系只解析一次；递归深度 ≤3（与 bundle 的展开守卫同值）。
  //   贴图缺失**只影响那一条子系**（bundle 侧记 `⚠ 缺纹理` 并跳它，父层与其余子系照画）。
  const resolveChildDefs = async (def, defRel, depth) => {
    const out = new Map();
    if (!def || !Array.isArray(def.children) || !def.children.length || depth > 3) return out;
    for (const c of def.children) {
      if (!c || typeof c.name !== 'string' || !c.name || out.has(c.name)) continue;
      let cdef = null, cdefRel = null, src = null;
      const ent = lib.getEntry(pkg, c.name);
      if (ent) { try { cdef = JSON.parse(rd(ent)); cdefRel = c.name; src = 'pkg' } catch (e) { cdef = null } }
      if (!cdef) {
        for (const cu of particleDefCandidates(c.name)) {
          const r = await jsonT(await fetchT(cu, null, NET_TIMEOUT_MS, '子系粒子定义兜底'), cu, NET_TIMEOUT_MS, '子系粒子定义正文');
          if (r && typeof r === 'object') { cdef = r; cdefRel = cu.replace(/^\/weassist\//, ''); src = 'weassist'; break }
        }
      }
      if (!cdef) { logf('  ⚠ 缺子系粒子定义 ' + c.name + '（父层 ' + (defRel || '?') + '）'); continue }
      let material = null;
      if (cdef.material) {
        const me = lib.getEntry(pkg, cdef.material);
        if (me) { try { material = JSON.parse(rd(me)) } catch (e) { material = null } }
        if (!material) {
          const cands = ['/weassist/' + String(cdef.material).replace(/^\/+/, '')];
          const m2 = /^(presets\/[^/]+)\//.exec(String(cdefRel || ''));
          if (m2) cands.push('/weassist/' + m2[1] + '/' + String(cdef.material).replace(/^\/+/, ''));
          for (const cu of cands) {
            const r = await jsonT(await fetchT(cu, null, NET_TIMEOUT_MS, '子系粒子材质兜底'), cu, NET_TIMEOUT_MS, '子系粒子材质正文');
            if (r) { material = r; break }
          }
        }
      }
      const pass = material && material.passes && material.passes[0];
      const texName = (pass && pass.textures && pass.textures[0]) || null;
      if (texName) {
        const e = await loadTex(texName);
        if (!e) logf('  ⚠ 缺纹理 materials/' + texName + '.tex（子系 ' + c.name + '，只跳这一条子系）');
      } else logf('  ⚠ 子系无纹理 ' + c.name + '（只跳这一条子系）');
      out.set(c.name, { def: cdef, texName: texName, blending: (pass && pass.blending) || 'translucent',
        // ①(P-149 overbright) 子系**自己的**材质因子（不继承父层）：渲染端 `renderParticleChildren`
        //   把它写进伪层的 `__particleOverbright`，与父层走同一条实例色装配。取值契约只有一份
        //   （`core/we-scene-bundle.js` 的 `particleOverbrightFactor`）。
        overbright: lib.particleOverbrightFactor(pass), defRel: cdefRel, src: src });
      const sub = await resolveChildDefs(cdef, cdefRel, depth + 1);
      for (const [k, v] of sub) if (!out.has(k)) out.set(k, v);
    }
    return out;
  };
  // 粒子层：def.material → pass.textures[0]（光斑贴图）→ loadTex；blending（additive/translucent）
  scene.layers.forEach((layer) => {
    if (!layer.particleDef || !layer.particleDef.material) return;
    jobs.push((async () => {
      let material;
      const matEntry = lib.getEntry(pkg, layer.particleDef.material);
      if (matEntry) material = JSON.parse(rd(matEntry));
      else {
        // ①(Q5) 包内没有 → 材质候选链（/weassist 直读 + 官方预设同主题路径）；旧实现只试第一种，
        //   索引兜底回来的 def 材质永远取不到 → 层有 def 却无贴图，renderParticleLayer 静默 return。
        for (const cu of particleMaterialCandidates(layer)) {
          // ①(P-135 乙) 候选链逐级也加超时：一级不返回 = 粒子层永远接不上贴图（且挡住整包 Promise.all）
          const r = await jsonT(await fetchT(cu, null, NET_TIMEOUT_MS, '粒子材质兜底'), cu, NET_TIMEOUT_MS, '粒子材质正文');
          if (r) { material = r; break }
        }
      }
      const pass = material && material.passes && material.passes[0];
      // ①(P-149 overbright) 粒子材质常量 `ui_editor_properties_overbright`（缺省 **1**）：
      //   它此前整块随 `constantshadervalues` 被丢弃 ⇒ 语料 25 个粒子层的亮度与作者本意不符
      //   （最大 5×、最小 0.17×；`dd/3719111841` 的 Bokeh Hex/Cir = 0.25，今天亮 4 倍）。
      //   取值契约（含"键缺失必须显式落 1"—— `Number(null) === 0`）唯一实现在
      //   `core/we-scene-bundle.js::particleOverbrightFactor`；这里只按层记下来，
      //   由渲染端在实例色装配时乘进 RGB（不动 alpha；`?overbright=legacy` 逐位回退）。
      layer.__particleOverbright = lib.particleOverbrightFactor(pass);
      const texName = pass && pass.textures && pass.textures[0];
      if (texName) {
        const e = await loadTex(texName);
        if (e) layer.particleTexName = texName;
      }
      layer.particleBlending = (pass && pass.blending) || 'translucent';
      if (!texName || !layer.particleTexName) logf('  ⚠ 粒子层 ' + (layer.name || layer.id) + ' 无纹理');
      // ①(P-144) 子系（children）—— 父层自己的贴图成功与否都不影响子系各自的解析
      try {
        if (Array.isArray(layer.particleDef.children) && layer.particleDef.children.length) {
          layer.__pchildMap = await resolveChildDefs(layer.particleDef, layer.particleDefRel || String(layer.particle || ''), 0);
          if (layer.__pchildMap.size) logf('  ◆ 子系 ' + layer.__pchildMap.size + ' 条（层 ' + (layer.name || layer.id) + '）');
        }
      } catch (e) { logf('  ⚠ 子系解析失败（层 ' + (layer.name || layer.id) + '）: ' + (e && e.message)); }
    })());
  });
  return Promise.all(jobs).then(() => true);
}

  // ①(最终方案B) 默认渲染=WebGL（秒开/不卡，且 refrender 实绘+长条眼窗+背景直绘+粒子关+无fit 全固化）。
  // ?mode=elysia：由顶部 MODE 分支显式走 Elysia CPU（保留对照路径）；此处不再路由 elysia。
  // 完成页：autorun 跑完全部场景后到达——只显示结论，绝不重新开始
  if ((typeof PAGE === 'undefined' || PAGE) && new URL(location.href).searchParams.has('autorundone')) {
    try {
      document.body.innerHTML = '<div style="font:16px monospace;padding:24px;color:#9f9">✅ 自动化测试完成（5 个场景已全部上报）<br>报告：服务器端 reports/ 目录（见 MPW_REPORTS_DIR） · 汇总：REPORT-WATCH2.md</div>'
      return
    } catch {}
  }
  // 页面级异常捕获：渲染循环万一被杀，这里直接报出真凶（不再"画面不动"无处查）
  try {
    if (typeof PAGE === 'undefined' || PAGE) {   // ①(P-77) 页级单例监听：多实例只由 primary 实例挂
    window.addEventListener('error', (e) => {
      try { logf('❌ 页面错误: ' + (e.message || String(e.error || e))) } catch {}
    })
    window.addEventListener('unhandledrejection', (e) => {
      try { logf('❌ 未处理Promise: ' + ((e.reason && e.reason.message) || String(e.reason || e))) } catch {}
    })
    }
  } catch {}
  // ═══ MPW-FRAMEGEOM-BEGIN ①(P-112-BANDGEOM 2026-09-17 任务书 §5-4 / P1-6 能力对齐线) video 壁纸帧盒 ═══
  // 为什么：`docs/WEB-FRAME-GEOMETRY-SPEC.md` §0 —— 内容（网页/视频）有自己的宽高比，舞台是另一个
  //   比例；`cover` 语义 = 视口取**内容比例**、溢出的一边居中裁掉（不拉伸、不露黑边）。
  //   旧路径把这件事整个交给 CSS `object-fit:cover`（改不了、也断言不了）；本块用帧几何模块把它
  //   变成**算得出来、测得了**的一组数：`coverViewport` 给帧盒、`frameVisibleRect` 给可见子矩形、
  //   `contentAspectOf` 只认**内在尺寸**（`videoWidth/videoHeight`）—— 元数据没到时宁可不处理，
  //   也不拿渲染盒当设计比例（规格 §3 记录的 15360×1200 误判就是后者）。
  // 开关：`?framegeom=` —— 缺省/`legacy`/`off`/`0` = **关**（video 元素样式与改动前逐字相同）；
  //   `cover` = 覆盖式视口（居中裁切，与旧 CSS 语义等价但由本模块算出）；`contain`/`fit` = 完整可见
  //   （露出的边由页面底色承担）；`stretch`/`fill` = 拉伸铺满；未知值回落 cover（规格 §4）。
  // ⚠ 只作用于"纯视频壁纸"两条路径（`?video=` 与按 project.json 自动识别的 type=video）：
  //   这是本仓库**唯一**能确定"内容比例 vs 舞台比例"的 DOM 帧；web 壁纸 iframe 的同类路径在
  //   三方 minified 渲染器内部（无注入点）⇒ 未定/缺证据，见 docs/AUDIO-BAND-WIRING.md §4。
  const FRAME_GEOM_FIT = (() => {
    try {
      const v = String(new URLSearchParams(location.search).get('framegeom') || '').trim().toLowerCase()
      if (v === '' || v === 'legacy' || v === 'off' || v === '0' || v === 'no' || v === 'false') return 'legacy'
      if (v === 'frame') return 'cover'          // 与渲染器侧 `?framegeom=frame` 同形（= 启用模块换算）
      return normalizeFrameFit(v)                // cover（缺省/未知）/ contain（fit）/ stretch（fill）
    } catch (e) { return 'legacy' }
  })()
  /** 纯函数：算出 video 帧盒（不碰 DOM 之外的东西；`tests/web-frame-geometry-wiring-test.mjs` 切片直测） */
  function videoFramePlan(natural, box, stageW, stageH, fit) {
    const aspect = contentAspectOf(box, natural)
    if (fit === 'legacy') return { fit, aspect, box: null, visible: null }
    if (!aspect) return { fit, aspect: null, box: null, visible: null }    // 量不到 ⇒ 交给 CSS（不猜）
    const vp = (fit === 'cover') ? coverViewport(stageW, stageH, aspect) : null
    const frameBox = vp || { width: stageW, height: stageH, left: 0, top: 0 }
    return { fit, aspect, box: frameBox, visible: frameVisibleRect(stageW, stageH, frameBox) }
  }
  function applyVideoFrameBox(el, label) {
    if (FRAME_GEOM_FIT === 'legacy') return null
    try {
      const stageW = (window.innerWidth || document.documentElement.clientWidth || 0)
      const stageH = (window.innerHeight || document.documentElement.clientHeight || 0)
      const plan = videoFramePlan(
        { width: el.videoWidth, height: el.videoHeight },
        { width: el.clientWidth, height: el.clientHeight },
        stageW, stageH, FRAME_GEOM_FIT)
      if (!plan.box) { logf('① 帧几何(' + FRAME_GEOM_FIT + ') ' + label + '：内容比例不可用 ⇒ 保持 CSS 原样'); return plan }
      const b = plan.box
      const of = (FRAME_GEOM_FIT === 'cover') ? 'cover' : (FRAME_GEOM_FIT === 'contain' ? 'contain' : 'fill')
      el.style.cssText = 'position:fixed;left:' + b.left + 'px;top:' + b.top + 'px;width:' + b.width + 'px;height:' + b.height
        + 'px;object-fit:' + of + ';z-index:0;background:#000'
      logf('① 帧几何(' + FRAME_GEOM_FIT + ') ' + label + '：内容 ' + (el.videoWidth || '?') + 'x' + (el.videoHeight || '?')
        + ' 比例 ' + (plan.aspect ? plan.aspect.toFixed(4) : '?') + '；帧盒 ' + Math.round(b.width) + 'x' + Math.round(b.height)
        + ' @(' + Math.round(b.left) + ',' + Math.round(b.top) + ')；可见区 '
        + (plan.visible ? (Math.round(plan.visible.width) + 'x' + Math.round(plan.visible.height) + ' @(' + Math.round(plan.visible.x) + ',' + Math.round(plan.visible.y) + ')') : '—'))
      return plan
    } catch (e) { return null }
  }
  // ═══ MPW-FRAMEGEOM-END ═══
  // ①(新) 按 project.json type 自动路由：type=video → 直接播 dd 目录松散 mp4（不再被当 scene 解析）
  //   ①(P-77) 页级单例：多实例时只有 primary 实例做这层路由（其余实例照常按 ?id= 装载场景）
  if (typeof PAGE === 'undefined' || PAGE) try {
    // ①(P-135 乙) 这两发在 `✅ WebGL2` 之后、`加载场景` 之前 ⇒ 挂住时日志恰好停在"已出 WebGL2 就没下文"
    //   （原报告 §1.4 判据表第 2 行的唯一候选卡点）。超时 → null → 照旧按"非视频"继续。
    const tr = await jsonT(await fetchT('/type/' + id, null, NET_TIMEOUT_MS, '路由判据'), '/type/' + id, NET_TIMEOUT_MS, '路由判据正文')
    if (tr && tr.ok && tr.type && String(tr.type).toLowerCase() === 'video') {
      const files = await jsonT(await fetchT('/ddlist/' + id, null, NET_TIMEOUT_MS, '视频文件表'), '/ddlist/' + id, NET_TIMEOUT_MS, '视频文件表正文')
      const mp4 = files && files.find((f) => /\.mp4$/i.test(f))
      if (mp4) {
        logf('自动识别为视频壁纸（type=video）→ 纯视频模式: ' + mp4)
        const v = document.createElement('video')
        v.src = '/ddvideo/' + id + '/' + encodeURIComponent(mp4)
        try { window.__mpwFixMedia && window.__mpwFixMedia(v) } catch (e) {}
        v.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000'
        v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true
        document.body.appendChild(v)
        v.addEventListener('error', () => logf('视频加载失败: ' + mp4))
        v.addEventListener('loadeddata', () => { logf('视频已加载 ' + (v.videoWidth || '?') + 'x' + (v.videoHeight || '?')); applyVideoFrameBox(v, 'type=video'); try { mpwSyncVideoRates() } catch (e) {} })
        return
      }
    }
  } catch {}
  // 纯视频模式：?video=<rel> 直接播放库中原始 mp4（伊蕾娜无水印整片等）
  const videoRel = (typeof PAGE === 'undefined' || PAGE) ? new URL(location.href).searchParams.get('video') : null
  if (videoRel) {
    logf('纯视频模式: ' + videoRel)
    const v = document.createElement('video')
    v.src = '/videolib/' + videoRel
    try { window.__mpwFixMedia && window.__mpwFixMedia(v) } catch (e) {}
    v.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000'
    v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true
    document.body.appendChild(v)
    v.addEventListener('error', () => logf('视频加载失败: ' + videoRel))
    v.addEventListener('loadeddata', () => { logf('视频已加载 ' + (v.videoWidth || '?') + 'x' + (v.videoHeight || '?')); applyVideoFrameBox(v, '?video=1'); try { mpwSyncVideoRates() } catch (e) {} })
    return
  }
  logf('加载场景 ' + id + '…');
  // ①(RE-25 场景集成 2026-09-12) 支持从任意 PKG/PKGM 容器加载：
  //   ?pkgpath=<本地绝对路径>（服务端直读）或 ?pkgurl=<http url>（服务端代理，绕 CORS）。
  //   插件（dsh-mpkg-wallpaper）会把用户壁纸的 .mpkg/scene.pkg 通过宿主 /raw 暴露成 url，
  //   于是"本地文件壁纸"也能走我们这套 WebGL 渲染器。
  const qs = new URLSearchParams(location.search)
  // ①(P-77) ?pkgpath/?pkgurl 是**整页单包**覆盖：多实例时只有 primary 实例（i=0）读它，
  //   其余格子各按自己的 ?ids= 项走 `/pkg/<id>`（否则 4 个格子会渲染同一个包）
  const __pkgOverrideOk = (typeof PAGE === 'undefined' || PAGE)
  const pkgPathQ = __pkgOverrideOk ? qs.get('pkgpath') : null, pkgUrlQ = __pkgOverrideOk ? qs.get('pkgurl') : null
  let buf = null
  // ①(P-135 乙) 取包阶段（`加载场景` 之后）是全链路唯一**不能跳过**的资源：超时只能如实报错，
  //   但错误必须是"看得懂的一行"（含 URL 与上限），而不是永久静默停在这一行日志。
  const pkgTimeoutErr = (what) => new Error(what + ' 取包失败或超时（上限 ' + NET_TIMEOUT_MS + 'ms）')
  if (pkgPathQ) {
    logf('加载本地容器: ' + pkgPathQ)
    const url = '/pkgpath?p=' + encodeURIComponent(pkgPathQ)
    const r = await fetchT(url, null, NET_TIMEOUT_MS, '本地容器')
    if (!r) throw pkgTimeoutErr('pkgpath')
    if (!r.ok) throw new Error('pkgpath HTTP ' + r.status)
    const b = await bufT(r, url, NET_TIMEOUT_MS, '本地容器正文')
    if (!b) throw pkgTimeoutErr('pkgpath 正文')
    buf = new Uint8Array(b)
  } else if (pkgUrlQ) {
    logf('加载远程容器: ' + pkgUrlQ)
    // ①(RE-25) 优先**浏览器直连**（带 cookie，可过 DSH 宿主鉴权）；失败再退服务端代理
    let okDirect = false
    try {
      const rd = await fetchT(pkgUrlQ, { credentials: 'include' }, NET_TIMEOUT_MS, '直连宿主')
      if (!rd) logf('直连失败（超时或网络异常），改用服务端代理')
      else if (rd.ok) {
        const b = await bufT(rd, pkgUrlQ, NET_TIMEOUT_MS, '直连宿主正文')
        if (b) { buf = new Uint8Array(b); okDirect = true; logf('直连成功 ' + buf.length + ' 字节') }
        else logf('直连失败（正文超时），改用服务端代理')
      } else logf('直连失败 HTTP ' + rd.status + '，改用服务端代理')
    } catch (e) { logf('直连异常: ' + e.message + '，改用服务端代理') }
    if (!okDirect) {
      const url = '/pkgurl?u=' + encodeURIComponent(pkgUrlQ)
      const r = await fetchT(url, null, NET_TIMEOUT_MS, '服务端代理')
      if (!r) throw pkgTimeoutErr('pkgurl')
      if (!r.ok) throw new Error('pkgurl HTTP ' + r.status)
      const b = await bufT(r, url, NET_TIMEOUT_MS, '服务端代理正文')
      if (!b) throw pkgTimeoutErr('pkgurl 正文')
      buf = new Uint8Array(b)
    }
  } else {
    const url = '/pkg/' + id
    const r = await fetchT(url, null, NET_TIMEOUT_MS, '场景包')
    if (!r) throw pkgTimeoutErr('pkg')
    // ①(P-87 2026-09-15 版权) 首屏默认包（3554161528）过去是**随仓库分发**的真实壁纸，已因版权移除。
    //   本机有语料时第一发就 200 ⇒ 这条路一行都不走，行为逐位不变；公开副本（无语料）时**显式**退到
    //   自带的合成样例，而不是把 404 的 "no scene" 字节喂给 parsePkg 报一个看不懂的错。
    //   ①**只在未显式指定包来源时**替换（无 ?id= 且非多实例 ?ids=）；显式指定的包拿不到就如实报错。
    if (!r.ok && !qs.has('id') && !MPW_MULTI_IDS) {
      const url2 = '/pkg/sample-synthetic'
      const r2 = await fetchT(url2, null, NET_TIMEOUT_MS, '自带合成样例')
      if (!r2 || !r2.ok) throw new Error('默认包 ' + id + ' HTTP ' + r.status + '，自带合成样例 sample-synthetic HTTP ' + ((r2 && r2.status) || '超时'))
      logf('⚠ 默认包 ' + id + ' 不可用（HTTP ' + r.status + '）—— 本仓库不分发真实壁纸 → 改用自带合成样例 sample-synthetic')
      id = 'sample-synthetic'
      const b2 = await bufT(r2, url2, NET_TIMEOUT_MS, '自带合成样例正文')
      if (!b2) throw pkgTimeoutErr('sample-synthetic 正文')
      buf = new Uint8Array(b2)
    } else {
      if (!r.ok) throw new Error('pkg HTTP ' + r.status + '（id=' + id + '）')
      const b = await bufT(r, url, NET_TIMEOUT_MS, '场景包正文')
      if (!b) throw pkgTimeoutErr('pkg 正文')
      buf = new Uint8Array(b)
    }
  }
  pkg = lib.parsePkg(buf)

  let skinAnimTime = 0, skinLastWall = 0
  function updateSkinBones(tSec) {

    const wall = tSec
    const dt = skinLastWall ? Math.max(0, wall - skinLastWall) : 0

    const maxStep = 1 / 30

    //   （模拟 600 帧混合快慢帧：单帧最大推进仍 ≈1/30s）
    const lag = wall - skinAnimTime

      if (!sk) continue

      //   rate=t*fps; fa=floor(rate)%len; fb=(fa+1)%len; tt=frac(rate) → 骨骼姿势插值
      //   （此前单帧取样 → 姿势阶跃 = 用户实测"弯耳朵成直角、眨眼后半段抽搐、人物突然后倾"）
      const rate = tAnim * sk.fps
      const period = sk.frameCount
      let ph = rate - Math.floor(rate / period) * period     // 相位 ∈ [0, period)

        //   而不是绕骨骼枢轴 → 旋转类骨骼（长发3/飘带/眼睑）看起来被整体翻转/甩飞。

  //        /shot 的 4MB 上限内），原始尺寸一并进元数据 ow/oh；
  //     ④ 全自动：**无确认框、不下载、不开新窗口**，唯一动作是 POST /shot（原始图片字节）。
  //   取帧口径（写明供真机核对）= **渲染帧末判到期**：渲染帧循环每帧结束时调
  //     `window.__mpwShotFrameTick(tSec, frameNo, canvas)`（见帧末取样点那一行），连拍时用纯函数
  //     `shotDue(lastMs, nowMs, 100)` 判"距上一次取样 ≥100ms 才拍一张" ⇒ 60Hz 上约每 6 帧取一张、
  //     慢机上每帧最多一张。**刻意不用 setInterval**：定时器会在两次渲染之间重复读同一张画布，
  //     同一张图连传 60 份对"抓眉毛那一下"毫无价值。渲染帧停摆（tab 切走/渲染卡住）时连拍也停，
  //     由 wall-clock 兜底超时收尾（不会永远卡在"连拍中…"）。
  //   与既有设施的关系：按钮照 🛰 立即上报 / 🎥 相机（P-84）同一骨架 —— 建按钮 → 挂 `#bar` →
  //     四种指针事件全 stop → click 回调 → 写日志；读回**必须**走 `__mpwSafeDataURL`（不透明源/跨源
  //     纹理污染时它返回 null 并置 `__mpwTainted`）⇒ 这里记一条日志跳过该帧，绝不像旧写法那样抛出去
  //     把整条上传链炸掉。**不加任何新的 URL 开关**（按钮 + 快捷键即可，`?cursor=`/`?ln=`/`?t=` 等照旧共存）。
  // ═══ MPW-SHOT-PURE-BEGIN（纯函数；shot-upload-test.mjs 会把这小段从 demo.html 切出来单测边界）═══
  // 缩放尺寸：宽度 ≤ maxW **一个像素都不动**；超了才等比缩到 maxW（高按比例四舍五入、下限 1）。
  // 零/非法尺寸 → {w:0,h:0}（调用方据此跳过这一帧，不抛异常）。
  function shotScale(w, h, maxW) {
    const W = Math.max(0, Math.floor(Number(w) || 0)), H = Math.max(0, Math.floor(Number(h) || 0))
    const M = Math.max(1, Math.floor(Number(maxW) || 0))
    if (!W || !H) return { w: 0, h: 0, scaled: false, srcW: W, srcH: H }
    if (W <= M) return { w: W, h: H, scaled: false, srcW: W, srcH: H }
    const k = M / W
    return { w: M, h: Math.max(1, Math.round(H * k)), scaled: true, srcW: W, srcH: H }
  }
  // 帧节流判定：距上次 ≥ intervalMs 才到期（**等于阈值算到期**，用 >= 不是 >）。
  //   lastMs 为 null/undefined/NaN = 还没拍过 → 立刻到期；intervalMs ≤ 0 = 不节流。
  function shotDue(lastMs, nowMs, intervalMs) {
    const iv = Number(intervalMs)
    if (!(iv > 0)) return true
    if (lastMs === null || lastMs === undefined) return true
    const last = Number(lastMs)
    if (!isFinite(last)) return true
    return (Number(nowMs) - last) >= iv
  }
  // ═══ MPW-SHOT-PURE-END ═══
  const mpwShot = (() => {
    if (!PAGE) return null                       // 页级单例：多实例只由 primary 实例挂按钮/钩子
    const MAXW = 1920, QUALITY = 0.82
    const DEFAULT_N = 60, INTERVAL = 100, CONC = 3
    const SHOT_URL = '/shot'
    const BASE_TITLE = '单击 = 连拍 ' + DEFAULT_N + ' 帧 × ≥' + INTERVAL + 'ms（≈6 秒）自动 POST /shot（无确认框、不下载、不弹窗）；连拍中再点 = 停止并把已拍的报完。原分辨率（>1920 宽才等比缩到 1920）。快捷键：j = 单帧立即上报（精确抓时机），J（Shift+j）= 连拍'
    const QS = (k, v) => k + '=' + encodeURIComponent(String(v))
    let btn = null, endWhy = ''
    const st = {
      on: false, ended: false, n: 0, sent: 0, fail: 0, skip: 0, singles: 0,
      total: DEFAULT_N, last: null, busy: 0, queue: [], t: 0, frame: 0, t0: 0, guard: null,
    }
    function queryFor(tag, meta) {
      const parts = [QS('id', id), QS('tag', tag)]
      if (meta.t) parts.push(QS('t', meta.t))
      if (meta.note) parts.push(QS('note', meta.note))
      if (meta.w) parts.push(QS('w', meta.w), QS('h', meta.h))
      if (meta.ow) parts.push(QS('ow', meta.ow), QS('oh', meta.oh))
      if (meta.frame) parts.push(QS('frame', meta.frame))
      return SHOT_URL + '?' + parts.join('&')
    }
    // 读回一帧：原分辨率 → （仅超宽才缩）→ __mpwSafeDataURL 守卫 → 原始字节（JPEG）
    function grab() {
      try {
        const sc = shotScale(cv.width, cv.height, MAXW)
        if (!sc.w || !sc.h) { logf('⚠ 连拍跳过该帧：画布尺寸为 0（' + cv.width + 'x' + cv.height + '）'); return null }
        const tc = document.createElement('canvas')
        tc.width = sc.w; tc.height = sc.h
        const cx = tc.getContext('2d')
        if (!cx) { logf('⚠ 连拍跳过该帧：2D 上下文不可用'); return null }
        cx.fillStyle = '#000'; cx.fillRect(0, 0, sc.w, sc.h)
        cx.drawImage(cv, 0, 0, sc.w, sc.h)
        // ①(B6) 读回守卫：污染时返回 null（已置 __mpwTainted）→ 跳过这一帧而不是抛
        const d = window.__mpwSafeDataURL ? window.__mpwSafeDataURL(tc, 'image/jpeg', QUALITY) : tc.toDataURL('image/jpeg', QUALITY)
        if (!d) { logf('⚠ 连拍读回失败（画布被跨源内容污染？已置 __mpwTainted）→ 跳过该帧'); return null }
        const b64 = String(d).split(',')[1] || ''
        const bin = atob(b64)
        const bytes = new Uint8Array(bin.length)
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
        return { bytes, sc, kb: Math.round(bytes.length / 1024) }
      } catch (e) { logf('⚠ 连拍读回异常：' + String((e && e.message) || e)); return null }
    }
    function post(job) {
      return fetch(queryFor(job.tag, job.meta), {
        method: 'POST',
        headers: { 'content-type': 'image/jpeg' },
        body: new Blob([job.bytes], { type: 'image/jpeg' }),
      })
        .then((r) => ({ ok: !!(r && r.ok), status: (r && r.status) || 0 }))
        .catch((e) => ({ ok: false, status: 0, error: String((e && e.message) || e) }))
    }
    function pump() {
      while (st.busy < CONC && st.queue.length) {
        const job = st.queue.shift()
        st.busy++
        post(job).then((r) => {
          st.busy--
          if (r.ok) {
            st.sent++
            logf('📸 ' + job.idx + '/' + job.n + ' 已上报 ' + job.kb + 'KB（t=' + (job.meta.t || '?') + ' 帧=' + job.meta.frame
              + ' ' + job.meta.w + 'x' + job.meta.h + (job.meta.ow !== job.meta.w ? '←原' + job.meta.ow + 'x' + job.meta.oh : '') + '）')
          } else {
            st.fail++
            logf('⚠ 连拍 ' + job.idx + '/' + job.n + ' 上报失败：' + (r.status ? 'HTTP ' + r.status : '异常 ' + r.error))
          }
          if (st.on) paint()
          else maybeFinish()
          pump()
        })
      }
    }
    function paint() { if (btn) btn.textContent = '📸 ' + st.n + '/' + st.total }
    function resetUi() {
      st.n = 0; st.sent = 0; st.fail = 0; st.skip = 0; st.singles = 0
      if (btn) { btn.textContent = '📸 连拍'; btn.title = BASE_TITLE }
    }
    // 连拍收尾：等队列传完 → 报一行汇总 → 1.5s 后复原按钮文案
    function maybeFinish() {
      if (st.on || !st.ended || st.busy || st.queue.length) return
      st.ended = false
      if (btn) btn.textContent = st.fail ? ('⚠ ' + st.sent + '/' + st.n + '（失败 ' + st.fail + '）') : ('✅ ' + st.sent + '/' + st.n)
      logf('📸 连拍收尾（' + endWhy + '）：取样 ' + st.n + ' 帧（读回跳过 ' + st.skip + '）、上报成功 ' + st.sent + '、失败 ' + st.fail
        + '、用时 ' + ((Date.now() - st.t0) / 1000).toFixed(1) + 's → POST ' + SHOT_URL)
      try { clearTimeout(st.guard) } catch (e) { /* ignore */ }
      setTimeout(() => { if (!st.on) resetUi() }, 1500)
    }
    // 拍一帧：连拍的 st.n 计"取样尝试数"（读回失败也算一次，否则帧不动时连拍永远结束不了）；
    //   单帧 j 用独立的 st.singles 计数 —— 连拍途中按 j 不会把连拍的帧数顶到 60 提前收尾。
    function shoot(tag, note) {
      const single = (tag === 'single')
      const idx = single ? (++st.singles) : (++st.n)
      const g = grab()
      if (!g) { st.skip++; return false }
      st.queue.push({
        idx, n: (single ? 1 : st.total), tag, kb: g.kb, bytes: g.bytes,
        meta: {
          t: st.t ? st.t.toFixed(3) : '', frame: st.frame || 0, note: note || '',
          w: g.sc.w, h: g.sc.h, ow: g.sc.srcW, oh: g.sc.srcH,
        },
      })
      pump()
      return true
    }
    function startBurst(n) {
      if (st.on) return
      st.on = true; st.ended = false
      st.n = 0; st.sent = 0; st.fail = 0; st.skip = 0
      st.total = (Number(n) > 0) ? Math.floor(Number(n)) : DEFAULT_N
      st.last = null                                  // 第一帧立刻取（不等 100ms）
      st.t0 = Date.now()
      if (btn) btn.title = '连拍中… 再点一次按钮 = 停止（已拍的会报完）｜快捷键：j = 单帧、J = 连拍/停止'
      paint()
      logf('📸 连拍开始：' + st.total + ' 帧 × ≥' + INTERVAL + 'ms（逐渲染帧判到期，约 ' + (st.total * INTERVAL / 1000).toFixed(1) + 's；再点按钮或按 J = 停止）')
      try { clearTimeout(st.guard) } catch (e) { /* ignore */ }
      // wall-clock 兜底：渲染帧停摆时别永远停在"连拍中…"（正常 6s 的连拍最迟 4× 时长收尾）
      st.guard = setTimeout(() => { if (st.on) burstEnd('超时 ' + Math.round((Date.now() - st.t0) / 1000) + 's（渲染帧停摆？）') }, st.total * INTERVAL * 4 + 3000)
    }
    function burstEnd(why) {
      if (!st.on) return
      st.on = false; st.ended = true
      endWhy = String(why || '停止')
      logf('📸 连拍停止（' + endWhy + '）：已取样 ' + st.n + ' 帧，剩下的传完就收尾')
      maybeFinish()                                   // 队列已空/全在传时立即收尾（否则由 pump 收尾）
    }
    // ---- 按钮（#bar，与 🎥 相机 / 🛰 立即上报 并排；四种指针事件全 stop，防被容器吃掉）----
    try {
      const bar = document.getElementById('bar')
      if (bar && bar.appendChild) {
        btn = document.createElement('button')
        btn.id = 'mpw-shot-btn'
        btn.type = 'button'
        btn.textContent = '📸 连拍'
        btn.title = BASE_TITLE
        btn.style.cssText = 'margin-left:8px;padding:2px 8px;font:12px monospace;cursor:pointer;background:#402;color:#fce;border:1px solid #a26;border-radius:4px'
        const stop = (ev) => { try { ev.stopPropagation(); if (ev.preventDefault) ev.preventDefault() } catch (e) { /* ignore */ } }
        for (const evn of ['pointerdown', 'pointerup', 'mousedown', 'touchstart']) btn.addEventListener(evn, stop)
        btn.addEventListener('click', (ev) => {
          stop(ev)
          if (st.on) burstEnd('用户第二次点击 = 停止')
          else startBurst(DEFAULT_N)
        })
        bar.appendChild(btn)
      }
    } catch (e) { btn = null }
    // ---- 帧末取样点：由渲染帧循环每帧结束调用（多实例时其它格子的帧也会调 ⇒ 认画布）----
    try {
      window.__mpwShotFrameTick = function (tSec, frameNo, canvas) {
        try {
          if (canvas !== cv) return
          st.t = Number(tSec) || 0
          st.frame = Number(frameNo) || 0
          if (!st.on) return
          const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()
          if (!shotDue(st.last, now, INTERVAL)) return
          st.last = now
          shoot('burst-' + String(st.n + 1).padStart(2, '0'), 'burst')
          if (st.n >= st.total) burstEnd('已取满 ' + st.total + ' 帧')
          else paint()
        } catch (e) { /* 取样失败不影响渲染 */ }
      }
    } catch (e) { /* ignore */ }
    // ---- 快捷键：j = 单帧立即上报；J（Shift+j）= 连拍/停止。capture 阶段只听、不 preventDefault ----
    try {
      window.addEventListener('keydown', (ev) => {
        try {
          if (!ev || ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey) return
          const tg = ev.target || {}
          const tn = String(tg.tagName || '').toUpperCase()
          if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT' || tg.isContentEditable) return   // 属性面板里打字不抢
          const k = String(ev.key || '')
          if (k === 'j') {
            const ok = shoot('single', 'key:j')
            logf('📸 快捷键 j：单帧上报' + (ok ? '已取样（原分辨率 ' + cv.width + 'x' + cv.height + '，随队列直传 /shot）' : '取样失败（见上一条日志）'))
          } else if (k === 'J') {
            if (st.on) burstEnd('快捷键 J = 停止')
            else { startBurst(DEFAULT_N); return }
          }
        } catch (e) { /* 快捷键失败不影响渲染 */ }
      }, true)
    } catch (e) { /* ignore */ }
    try {
      logf('📸 一键连拍已绑定：按钮 #mpw-shot-btn（单击 = 连拍 ' + DEFAULT_N + ' 帧、再点 = 停止），快捷键 j = 单帧上报、J（Shift+j）= 连拍；'
        + '取帧 = 渲染帧末判 ≥' + INTERVAL + 'ms 到期、原分辨率（>' + MAXW + ' 宽才等比缩）；落盘 POST ' + SHOT_URL + ' → reports/shots/<id>/')
    } catch (e) { /* ignore */ }
    return { start: startBurst, stop: burstEnd, single: (note) => shoot('single', note || 'api'), state: st, button: btn, tick: (t, f) => window.__mpwShotFrameTick(t, f, cv) }
  })()
  try { window.__mpwShot = mpwShot; window.__mpwShotBtn = mpwShot ? mpwShot.button : null } catch (e) { /* ignore */ }
  // ═══ MPW-SHOT-BTN-END ═══
  // ①(MERGED-2 E 2026-09-12) ?selfcheck=1 页内自检（**默认关、只读**，不改任何渲染行为）：
  //   首帧后统计 layersVisible/layersDrawn/layersSkipped、texLoaded/texMissing、whiteFallbackLayers[]、
  //   scriptErrs、sprites/textLayers/particles，POST 一份 ≤8KB 紧凑 JSON 到 /diag（失败回退 /report）。
  //   字段名与 package-matrix 对齐；页面显示一行「自检: OK/异常 N 项」。详见 SELFCHECK.md。
  if ((typeof PAGE === 'undefined' || PAGE) && new URLSearchParams(location.search).has('selfcheck')) {
    ;(window.__mpwScriptErrs = window.__mpwScriptErrs || {})
    window.addEventListener('error', (e) => { try { const k = String(e.message || 'error').slice(0, 80); window.__mpwScriptErrs[k] = (window.__mpwScriptErrs[k] || 0) + 1 } catch {} })
    setTimeout(async () => {
      try {
        // [首帧] 审计日志（auditFrames 默认 1，onLog 已接 logf）→ 绘制/跳过层数
        const logText = (document.getElementById('log') ? document.getElementById('log').textContent : '')
        const visLines = (logText.match(/^\[首帧\] #\d+ .+ vis=1/gm) || []).length
        const skipLines = (logText.match(/^\[首帧\] \. #\d+ 跳过/gm) || []).length
        const failLines = (logText.match(/跳过渲染失败的层/g) || []).length
        const layerArr = (scene && scene.layers) || []
        const layersVisible = layerArr.filter((l) => l.visible).length
        const whiteFallbackLayers = layerArr
          .filter((l) => l.visible && !l.isContainer && !l.solid && !l.__text && l.textureName && !textures.has(l.textureName))
          .map((l) => String(l.name || l.id).slice(0, 24)).slice(0, 12)
        const texMissingLayers = layerArr
          .filter((l) => l.visible && !l.isContainer && l.textureName && !textures.has(l.textureName))
          .map((l) => String(l.name || l.id).slice(0, 24)).slice(0, 12)
        let spriteTextures = 0; try { textures.forEach((t) => { if (t && t.sprite) spriteTextures++ }) } catch {}
        const errsObj = window.__mpwScriptErrs || {}
        const scriptErrs = Object.keys(errsObj).length
          ? Object.entries(errsObj).map(([k, v]) => k + '×' + v).slice(0, 6)
          : []
        // 异常判定与 package-matrix 门禁同口径
        const anomalies = []
        if (layerArr.length > 0 && layersVisible === 0) anomalies.push('可见层数为0')
        if (failLines > 0) anomalies.push('层绘制失败×' + failLines)
        if (whiteFallbackLayers.length > 0) anomalies.push('白块层×' + whiteFallbackLayers.length)
        if (texMissingLayers.length > 0) anomalies.push('缺纹理×' + texMissingLayers.length)
        if (scriptErrs.length > 0) anomalies.push('脚本错误×' + scriptErrs.length)
        const report = {
          kind: 'selfcheck', id: id, at: new Date().toISOString(), url: location.href.slice(0, 160),
          layersVisible, layersDrawn: Math.max(0, visLines - skipLines), layersSkipped: skipLines,
          texLoaded: textures.size, texMissing: texMissingLayers,
          whiteFallbackLayers, scriptErrs,
          sprites: { textures: spriteTextures, particles: (scene && scene.layers ? scene.layers.filter((l) => { const t = l.particleTexName ? textures.get(l.particleTexName) : null; return !!(l.particleDef && t && t.sprite) }).length : 0) },
          textLayers: layerArr.filter((l) => l.__text).length,
          particles: layerArr.filter((l) => l.particleDef).length,
          anomalies,
        }
        const body = JSON.stringify(report)
        let ok = false
        // ①(P-135 乙) 上报链（/diag → /report 兜底）：两发都要有上限，否则上报挂住会拖住后面的收尾
        try { const r = await fetchT('/diag', { method: 'POST', headers: { 'content-type': 'application/json' }, body }, NET_TIMEOUT_MS, '自动上报 /diag'); ok = !!(r && r.ok) } catch {}
        if (!ok) { try { await fetchT('/report', { method: 'POST', body }, NET_TIMEOUT_MS, '自动上报 /report 兜底') } catch {} }
        const msg = '自检: ' + (anomalies.length ? '异常 ' + anomalies.length + ' 项（' + anomalies.join('、') + '）' : 'OK') + ' · 报告已 POST（' + body.length + 'B）'
        const badge = document.createElement('div')
        badge.textContent = msg
        badge.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9999;font:12px monospace;padding:4px 8px;border-radius:4px;' +
          (anomalies.length ? 'background:#602;color:#fbb' : 'background:#040;color:#bfb')
        document.body && document.body.appendChild(badge)
        logf(msg)
      } catch (e) { try { logf('自检失败: ' + e.message) } catch {} }
    }, 5000)
  }
  // ①(MERGED-2 B 2026-09-12) ?perf=1 / ?perf=auto 性能面板（**默认关**；只读计时 + 可选降级，不改默认渲染）。
  //   经 bundle 的 stats 钩子（runPostFrameHooks → registerMpwHook('stats')）拿每帧
  //   { frameMs, gpuMs, draws, layerMs, textures, texBytesEst, auto }，聚最近 120 帧 p50/p95、每层平均 ms、
  //   draw call、纹理数、显存估算；右上角小面板（可关）。?perf=1&perfreport=1 时 POST /diag（失败回退 /report）。
  {
    const perfQ = new URLSearchParams(location.search).get('perf')
    if ((typeof PAGE === 'undefined' || PAGE) && (perfQ === '1' || perfQ === 'auto')) {
      const roll = []            // 最近 120 帧的 frameMs
      const gpuRoll = []
      const layerAgg = new Map() // 层名 → { sum, n }（全窗累计平均）
      const pct = (arr, q) => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * q))] }
      lib.registerMpwHook('stats', (st) => {
        if (!st || st.perf !== true) return
        if (typeof st.frameMs === 'number') { roll.push(st.frameMs); if (roll.length > 120) roll.shift() }
        if (typeof st.gpuMs === 'number' && st.gpuMs > 0) { gpuRoll.push(st.gpuMs); if (gpuRoll.length > 120) gpuRoll.shift() }
        for (const e of (st.layerMs || [])) {
          const name = e[0], avg = e[1], n = e[2] || 1
          const r = layerAgg.get(name) || { sum: 0, n: 0 }
          r.sum += avg * n; r.n += n
          layerAgg.set(name, r)
        }
        const topLayers = [...layerAgg.entries()].map(([k, v]) => [k, +(v.sum / v.n).toFixed(2)]).sort((a, b) => b[1] - a[1]).slice(0, 8)

  //     A 媒体集成以 `scriptCache` 为前提 → 缓存**默认开**（见文件上段的 scriptCacheOn）；`?scriptcache=0`
  //       时不建宿主并日志说明（无缓存 → 每帧重编译 → `var mediaData` 每帧被重置 → 歌名永远空白）。
  //     B `applySceneScripts` 的 `audioBuffers` 已换成 `mpwMediaHost.audioBuffers(n)`（同一 n 同一对象、原地更新）。
  //     C `sceneScriptCache.shared = scriptShared`（见缓存块，P-62 陷阱 C）。
  //     D 面板/`?props=` 改值 → `invalidateUserProps`（`invalidateScriptPropsCache`，P-62 陷阱 D）。
  //   媒体源：
  //     ① 真实源 = 顶栏 🔊 音频面板正在播的那条音轨（歌名=文件名、进度/时长/播放态=元素真值）
  //     ② 注入源 = `?media=title=…,artist=…,cover=<包内路径>,position=…,duration=…,playback=playing`
  //        或控制台 `__mpwMedia.set({…}) / .play() / .pause() / .position(30) / .spectrum({volume:.8})`
  //   **没有媒体时什么都不派发**（P-62 §5.4）：作者层停在 authored 占位文本/可见性，不新增报错。
  //   歌词：只在**包内自带** `.lrc` 时使用（P-62 §6 语料 0 命中 → 通常直接跳过，**不联网抓**）；
  //        `?lyrics=<包内路径>` 手工覆盖、`?lyrics=0`/`off` 显式关闭。
  //   注：封面进画面走官方材质纹理槽 `$mediaThumbnail`（`effects[].passes[].usertextures`）——
  //        那一段解析在 `core/we-scene-bundle.js` 里（本文件无权改），本块只把封面数据备好（`getCoverForTexture`）。

  // `?media=k=v,k=v` → 对象（值内不出现逗号）。用**字面量正则**解析（与 `?lyrics=` 同款）：
  //   ① 只吃 query 串、不碰 location → Node 里可直接单测；② diag-flag-check 的 (c) 规则能抓到该开关
  //   → README 主表双向比对不落空。
  function parseMediaQuery(search) {
    const m = /[?&]media=([^&#]*)/.exec(String(search === undefined || search === null ? '' : search))
    if (!m) return null
    let raw = m[1]
    try { raw = decodeURIComponent(raw.replace(/\+/g, '%20')) } catch (e) { /* 保持原样 */ }
    if (!raw) return null                       // `?media=`（空）→ 不注入（不当成"有媒体"）
    const out = {}
    for (const part of String(raw).split(',')) {
      const i = part.indexOf('=')
      if (i <= 0) continue
      const k = part.slice(0, i).trim().toLowerCase()
      if (k) out[k] = part.slice(i + 1).trim()
    }
    return out
  }
  // 面板取色口径（线性 0..1 数组）：media-host 的 `toColor` 会把它转成 Vec3 实例（脚本要调 .multiply()）
  function mediaHexToLinear(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''))
    if (!m) return null
    const s = m[1], out = []
    for (let i = 0; i < 3; i++) out.push(parseInt(s.substr(i * 2, 2), 16) / 255)
    return out
  }
  const MEDIA_MIME = (p) => {
    const s = String(p || '').toLowerCase()
    if (/\.png$/.test(s)) return 'image/png'
    if (/\.(jpe?g)$/.test(s)) return 'image/jpeg'
    if (/\.webp$/.test(s)) return 'image/webp'
    if (/\.gif$/.test(s)) return 'image/gif'
    return ''
  }
  // 把 `?media=` 的键组装成 `host.setMedia(patch)` 的入参（纯函数；read 缺省用包内条目读字节）
  function buildMediaPatch(q, read) {
    const readEntry = typeof read === 'function' ? read : ((p) => { try { return lib.getEntry(pkg, p) || lib.getEntry(pkg, String(p).replace(/\\/g, '/')) || null } catch (e) { return null } })
    const patch = {}
    if (q.title !== undefined) patch.title = q.title
    if (q.artist !== undefined) patch.artist = q.artist
    if (q.album !== undefined) patch.albumTitle = q.album
    if (q.albumartist !== undefined) patch.albumArtist = q.albumartist
    if (q.subtitle !== undefined) patch.subTitle = q.subtitle
    if (q.genres !== undefined) patch.genres = q.genres
    if (q.type !== undefined) patch.contentType = q.type
    if (q.coverurl !== undefined) patch.coverUrl = q.coverurl
    if (q.cover !== undefined && q.cover !== '') {
      const bytes = readEntry(q.cover)
      if (bytes) { patch.coverBytes = bytes; patch.coverMime = MEDIA_MIME(q.cover) }
    }
    if (q.position !== undefined && isFinite(Number(q.position))) patch.position = Number(q.position)
    if (q.duration !== undefined && isFinite(Number(q.duration))) patch.duration = Number(q.duration)
    if (q.color !== undefined) {
      const c = mediaHexToLinear(q.color)
      if (c) { patch.primaryColor = c; patch.secondaryColor = c; patch.tertiaryColor = c }
    }
    if (q.playback !== undefined) patch.playback = q.playback
    return patch
  }
  // 把 `?media=` 立刻应用到宿主（装载后手动调用/单测用；正常路径见 initMediaHost 的"首帧再投递"）
  function applyMediaQuery(host, search, read) {
    const q = parseMediaQuery(search)
    if (!q || !host) return null
    const patch = buildMediaPatch(q, read)
    const r = host.setMedia(patch)
    if (q.playback !== undefined && host.setPlayback) host.setPlayback(q.playback)
    return { patch, keys: Object.keys(patch), dispatched: (r && r.dispatched) || [] }
  }
  // 歌词：包内探测（entryPaths/readText/search 可注入 → 单测不需要真包）。返回 {path,lines}|null，**不碰宿主**
  function mpwMediaResolveLyrics(opts) {
    const o = opts || {}
    let override = null
    try { override = lyricsOverrideFromSearch(o.search !== undefined ? o.search : location.search) } catch (e) { override = null }
    let paths = o.entryPaths
    if (!paths) {
      try { paths = (pkg && pkg.entries ? pkg.entries : []).map((e) => e && (e.name || e.path)).filter(Boolean) } catch (e) { paths = [] }
    }
    const readText = o.readText || ((p) => { try { return lib.getEntry(pkg, p) || lib.getEntry(pkg, String(p).replace(/\\/g, '/')) || null } catch (e) { return null } })
    return resolveLyrics({ override, entryPaths: paths, mediaPath: o.mediaPath, mediaName: o.mediaName, readText })
  }
  // 有自带歌词就 setLyrics，没有就跳过（**不联网抓**）
  function mpwMediaLyrics(host, mediaPath, mediaName, opts) {
    const r = mpwMediaResolveLyrics(Object.assign({ mediaPath, mediaName }, opts || {}))
    if (host && r && r.lines && r.lines.length) { host.setLyrics(r.lines, { path: r.path }); return r }
    return null
  }
  // 每帧（排在 runSceneScripts 之后）：真实源 → setMedia/updatePosition/setPlayback；频谱 → setAudioSpectrum；tick 推进
  let mpwMediaTrackPath = ''
  let mpwMediaLastPosAt = -1e9
  let mpwMediaLastPlayback = -1
  let mpwMediaLastSpectrumAt = -1e9
  let mpwMediaPendingInject = null      // `?media=` 在**首帧之后**才投递（此前脚本还没编译进 cache → 投递不到）
  let mpwMediaSpectrum = null
  function mpwMediaNow() { try { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now() } catch (e) { return Date.now() } }
  function mpwMediaTick() {
    if (!mpwMediaHost) return
    const t = mpwMediaNow()
    // ① 首帧后补投 `?media=`（P-62 陷阱 A 的时序面：cache 里要有脚本条目才投递得到）
    if (mpwMediaPendingInject) {
      const p = mpwMediaPendingInject
      mpwMediaPendingInject = null
      try { mpwMediaHost.setMedia(p.patch); if (p.patch.playback !== undefined) mpwMediaHost.setPlayback(p.patch.playback) } catch (e) { /* ignore */ }
      try { if (p.lyrics) mpwMediaHost.setLyrics(p.lyrics.lines, { path: p.lyrics.path }) } catch (e) { /* ignore */ }
    }
    // ② 真实源：🔊 音频面板正在播的那条音轨（`window.__mpwAudio.current.el` 由面板发布）
    let src = null
    try {
      const cur = window.__mpwAudio && window.__mpwAudio.current
      if (cur && cur.el) src = { path: String(cur.path || ''), el: cur.el }
    } catch (e) { /* ignore */ }
    if (src) {
      if (src.path && src.path !== mpwMediaTrackPath) {
        mpwMediaTrackPath = src.path
        const nm = src.path.split('/').pop().replace(/\.[^.]+$/, '')
        const dur = (() => { try { const d = Number(src.el.duration); return (isFinite(d) && d > 0) ? d : 0 } catch (e) { return 0 } })()
        try { mpwMediaHost.setMedia({ title: nm, contentType: 'audio', duration: dur, position: Number(src.el.currentTime) || 0 }) } catch (e) { /* ignore */ }
        try { mpwMediaLyrics(mpwMediaHost, src.path, nm, null) } catch (e) { /* ignore */ }
        mpwMediaLastPosAt = t
      }
      // 进度：元素是权威 → ≥250ms 取一次（P-62 §5.5：不逐帧刷 mediaTimelineChanged，tick() 会按墙钟补）
      if (t - mpwMediaLastPosAt >= 250) {
        mpwMediaLastPosAt = t
        try { mpwMediaHost.updatePosition(Number(src.el.currentTime) || 0) } catch (e) { /* ignore */ }
      }
      const pb = src.el.paused ? 2 : 1
      if (pb !== mpwMediaLastPlayback) {
        mpwMediaLastPlayback = pb
        try { mpwMediaHost.setPlayback(pb === 1 ? 'playing' : 'paused') } catch (e) { /* ignore */ }
      }
    }
    // ③ 频谱：复用场景 sound 层那**一个** analyser（P-57）；限流 ~30Hz，Float32Array 引用直收（原地更新）
    if (sceneAudio.analyser && sceneAudio.freq && t - mpwMediaLastSpectrumAt >= 33) {
      mpwMediaLastSpectrumAt = t
      try {
        sceneAudio.analyser.getByteFrequencyData(sceneAudio.freq)
        const n = sceneAudio.freq.length
        if (!mpwMediaSpectrum || mpwMediaSpectrum.length !== n) mpwMediaSpectrum = new Float32Array(n)
        for (let i = 0; i < n; i++) mpwMediaSpectrum[i] = sceneAudio.freq[i] / 255
        mpwMediaHost.setAudioSpectrum({ average: mpwMediaSpectrum })
      } catch (e) { /* ignore */ }
    }
    try { mpwMediaHost.tick(t) } catch (e) { /* ignore */ }
    try { window.__mpwMediaState = mpwMediaHost.getState() } catch (e) { /* ignore */ }
  }
  ;(function initMediaHost() {
    // ①(P-77) 媒体集成宿主是页级单例（官方五回调 + window.__mpwMedia）：多实例时只有 primary 实例建
    if (!(typeof PAGE === 'undefined' || PAGE)) return
    if (!sceneScriptCache) {
      logf('② P-64 媒体集成：?scriptcache=0（无脚本缓存）→ 不建媒体宿主（P-62 陷阱 A：媒体集成以缓存为前提）')
      return
    }
    if (typeof createMediaHost !== 'function') { logf('⚠ P-64 媒体集成：elysia/media-host.js 未加载'); return }
    try {
      mpwMediaHost = createMediaHost({
        dispatch: (name, payload) => dispatchScriptEvent(sceneScriptCache, name, payload, {
          onError: (n, e) => {
            try {
              window.__mpwScriptErrs = window.__mpwScriptErrs || {}
              const k = 'media:' + n + ':' + String((e && e.message) || e).slice(0, 40)
              window.__mpwScriptErrs[k] = (window.__mpwScriptErrs[k] || 0) + 1
              if (window.__mpwScriptErrs[k] === 1) logf('⚠ 媒体回调[' + n + ']异常（已容错）: ' + ((e && e.message) || e))
            } catch (e2) { /* ignore */ }
          },
        }),
      })
    } catch (e) { mpwMediaHost = null; logf('⚠ P-64 媒体集成宿主创建失败: ' + ((e && e.message) || e)); return }
    // 注入入口 A：`?media=…` —— **不在装载时投递**（此刻 cache 里还没有脚本条目，dispatchScriptEvent
    //   拿不到 entry → 事件会白丢）；解析成 patch 挂起，首帧（脚本已编译）再 setMedia 一次即达。
    let injKeys = null
    try {
      const q = parseMediaQuery(location.search)
      if (q) {
        const patch = buildMediaPatch(q, null)
        let ly = null
        try { ly = mpwMediaResolveLyrics({ search: location.search, mediaName: q.title || '' }) } catch (e) { ly = null }
        mpwMediaPendingInject = { patch, lyrics: (ly && ly.lines && ly.lines.length) ? ly : null }
        injKeys = Object.keys(patch)
      }
    } catch (e) { /* 注入解析失败不影响其他 */ }
    // 注入入口 B：控制台 `__mpwMedia`
    window.__mpwMedia = {
      host: mpwMediaHost,
      set: (patch) => { try { return mpwMediaHost.setMedia(patch) } catch (e) { return null } },
      play: () => { try { return mpwMediaHost.setPlayback('playing') } catch (e) { return null } },
      pause: () => { try { return mpwMediaHost.setPlayback('paused') } catch (e) { return null } },
      stop: () => { try { return mpwMediaHost.clearMedia() } catch (e) { return null } },
      position: (s) => { try { return mpwMediaHost.updatePosition(s) } catch (e) { return null } },
      spectrum: (spec) => { try { return mpwMediaHost.setAudioSpectrum(spec) } catch (e) { return null } },
      lyrics: (lrc, path) => { try { return mpwMediaHost.setLyrics(lrc, { path }) } catch (e) { return null } },
      cover: () => { try { return mpwMediaHost.getCoverForTexture() } catch (e) { return null } },
      state: () => { try { return mpwMediaHost.getState() } catch (e) { return null } },
      // 手动重播当前状态（脚本缓存刚重建/想强制刷新时用；P-62 的 push* 全家桶）
      repush: () => { try { return [mpwMediaHost.pushStatus(), mpwMediaHost.pushProperties(), mpwMediaHost.pushThumbnail(), mpwMediaHost.pushTimeline()] } catch (e) { return null } },
    }
    try { window.__mpwMediaState = mpwMediaHost.getState() } catch (e) { /* ignore */ }
    logf('② P-64 媒体集成宿主已装载（回调 → dispatchScriptEvent；源：🔊 音频面板音轨 / __mpwMedia'
      + (injKeys ? ' / ?media= 已注入 ' + JSON.stringify(injKeys) + '（首帧投递）' : '') + '；歌词只在包内自带时使用）')
  })()
  // ═══ MPW-MEDIA-END ═══
  // ═══ ①(P-77 一页多实例·第 5 步) 实例句柄：调度器驱动 or 单实例自驱 + **显式释放路径** ═══
  //   释放必须显式（设计文档 §2.2 disposed）：`WEBGL_lose_context.loseContext()` + 清引用 + 从调度器摘除。
  //   否则来回切实例 = 显存只涨不落（本机 15G 内存曾 swap 到 10G）。
  const mpwHandle = {
    id, canvas: cv, gl, ctx: inst.ctx,
    frame,
    dispose: () => {
      mpwDisposed = true;
      try { if (rafId != null) cancelAnimationFrame(rafId) } catch (e) {}
      rafId = null;
      // ①(2026-09-21 活档位) 摘掉本实例装的 ResizeObserver / resize / DPR 媒体查询监听
      //   （多实例来回切时不留悬挂监听；`inst` 是本实例记录，装载时就写好的那个对象）
      try { if (typeof inst.liveResDispose === 'function') inst.liveResDispose() } catch (e) {}
      try { mpwLoseContext(gl) } catch (e) { logf('⚠ loseContext 失败: ' + ((e && e.message) || e)) }
      try {
        for (const t of textures.values()) {
          if (!t) continue;
          if (t.video) {
            try { t.video.pause() } catch (e) {}
            try { if (t.video.src && String(t.video.src).indexOf('blob:') === 0) URL.revokeObjectURL(t.video.src) } catch (e) {}
            try { if (t.video.parentNode) t.video.parentNode.removeChild(t.video) } catch (e) {}
          }
          t.glTex = null; t.rgba = null; t.canvas = null;
        }
      } catch (e) {}
      try { textures.clear() } catch (e) {}
      // 清引用：scene/renderer/pkg 都是大对象（纹理/FBO/网格缓冲挂在 renderer 上）
      renderer = null; scene = null; pkg = null;
      logf('① 实例已释放（' + id + '）：loseContext + 清引用 + 从调度器摘除');
    },
  };
  if (SCHEDULED) {
    // 多实例：帧交给**唯一**的调度器（multi-instance.js），这里不自排 rAF
    try { if (typeof inst.onReady === 'function') inst.onReady(mpwHandle) } catch (e) {}
  } else {
    rafId = requestAnimationFrame(frame);
  }
  // ①(2026-09-21 宿主 API) 实例句柄就绪 ⇒ `__wp.release()` 用它（与 P-77 的显式释放同一条路）
  mpwHostDisposeFn = () => mpwHandle.dispose();
  return mpwHandle;
}
// ═══ ①(P-77 一页多实例·第 1~5 步) 两个调用点 ═══
//   ① 无 `?ids=` ⇒ **单实例调用点**：inst 字段就是原来的模块级常量、primary=true ⇒ 页级 UI/上报全开，
//      与改动前逐位一致（红线）。② 有 `?ids=` ⇒ 建多实例宿主：N 个 canvas/context（≤ maxinst），
//      **只有被点中的实例在跑**，其余 0 帧；释放走 loseContext。
if (MPW_MULTI_IDS) {
  // 多实例：`#sc` 让位给网格（它的上下文根本没创建，见上面 gl 的写法）
  try { cv.style.display = 'none' } catch (e) {}
  const mpwInstBoot = (rec) => {
    // 每个格子自己取一个 webgl2 上下文（上限由 maxinst 硬性封顶；超限的格子上面就不建 canvas）
    const glI = rec.canvas.getContext('webgl2', { antialias: true, alpha: true, preserveDrawingBuffer: true });
    if (!glI) throw new Error('该格子取不到 WebGL2 上下文（可能已达浏览器上下文上限）');
    return bootInstance({
      canvas: rec.canvas, gl: glI, id: rec.id,
      primary: rec.i === 0,        // 页级 UI/上报只在第一个格子（primary）上跑
      scheduled: true,             // 帧由调度器推进（不自排 rAF）
      res: MPW_MULTI_BUDGET.res,   // 预算降档（maxinst ≥ 3 → 720p；?res= 已让位）
      particleBudget: MPW_MULTI_BUDGET.particleBudget,
      ctx: rec.ctx,
      logEl: log, fpsEl,
      logf: mpwMultiHost.logfFor(rec.i),
    });
  };
  mpwMultiHost = createMultiInstanceHost({
    ids: MPW_MULTI_IDS.ids, invalid: MPW_MULTI_IDS.invalid, dupes: MPW_MULTI_IDS.dupes,
    opts: MPW_MULTI_OPTS, budget: MPW_MULTI_BUDGET,
    doc: document, win: window, logEl: log,
    boot: mpwInstBoot,
    onSnapshot: (rows, instances) => {
      try { window.__mpwInstances = rows } catch (e) {}
      // ①(设计文档 §2.5) 既有单例 __mpw* 全局**保持不变**，多实例时指向 **active 实例**：
      //   这里把 active 的 fps 镜像到 window.__mpwFps（旧消费者读的就是它）。
      try {
        const a = instances.find((r) => r.selected) || instances[0];
        if (a) { window.__mpwInstActive = a.id; window.__mpwFps = Math.round(a.fps) }
      } catch (e) {}
    },
    onState: (rec) => { try { window.__mpwInstActive = rec.id } catch (e) {} },
  });
  try { window.__mpwInstBudget = { maxinst: MPW_MULTI_BUDGET.maxinst, res: MPW_MULTI_BUDGET.res, downgrade: MPW_MULTI_BUDGET.downgrade, over: MPW_MULTI_BUDGET.over, reasons: MPW_MULTI_BUDGET.reasons } } catch (e) {}
  logf('① 一页多实例：' + MPW_MULTI_IDS.ids.length + ' 个 id（上限 ' + MPW_MULTI_BUDGET.maxinst + '，布局 ' + MPW_MULTI_OPTS.layout
    + '，非当前实例 ' + MPW_MULTI_OPTS.inactive + '）'
    + (MPW_MULTI_BUDGET.downgrade ? '；' + MPW_MULTI_BUDGET.reasons.join('；') : '')
    + (MPW_MULTI_IDS.invalid.length ? '；忽略非法 id ' + MPW_MULTI_IDS.invalid.length + ' 个' : '')
    + (MPW_MULTI_IDS.dupes.length ? '；去重 ' + MPW_MULTI_IDS.dupes.length + ' 个' : ''))
  MPW_MULTI_OPTS.notes.forEach((n) => logf('  ⚠ ' + n))
  mpwMultiHost.observeVisibility();
  mpwMultiHost.start().then(() => {
    logf('① 多实例装载完成：' + mpwMultiHost.instances.filter((r) => r.handle).length + ' 个在跑（其余暂停，点格子激活）');
  }).catch((e) => {
    logf('❌ 多实例启动失败: ' + ((e && e.message) || e));
    try { window.__mpwCapErr && window.__mpwCapErr('multi: ' + String((e && e.message) || e)) } catch (e2) {}
  });
} else {
// ═══ ①(P-77 一页多实例·第 1 步) 单实例调用点：inst 字段**就是**原来的模块级常量 ═══
//   无 ?ids= 时走这里：一个实例、primary=true ⇒ 页面级 UI/上报路径全开（与改动前逐位一致）。
const MPW_PRIMARY_INST = { canvas: cv, gl, id, logEl: log, fpsEl, logf, primary: true };
bootInstance(MPW_PRIMARY_INST).catch((e) => { logf('❌ 启动失败: ' + e.message); try { window.__mpwCapErr && window.__mpwCapErr('boot: ' + String((e && e.message) || e)) } catch (e2) {} });
}
} // end !elysia
